name = "rejectmuhammad-xyz"
main = "src/worker.ts"
compatibility_date = "2026-11-05"
# Keep workers.dev off the public index surface; Worker still 301s *.workers.dev → apex.
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
